<html lang="ru"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Математика</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Neucha&family=PT+Sans:wght@400;700&display=swap">
<style>
:root{--ground:#f0f4fa;--grid:#dfe7f2;--paper:#fbfcfe;--ink:#1c2a55;--soft:#56628a;--line:#c9d3e6}
@media (prefers-color-scheme:dark){:root{--ground:#131a36;--grid:#222c52;--paper:#192142;--ink:#e4e9fa;--soft:#9aa6cc;--line:#34406b;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background-color:var(--ground);background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:24px 24px;color:var(--ink);font:17px/1.5 'PT Sans',system-ui,sans-serif;padding:24px max(16px,env(safe-area-inset-right,0px)) 48px max(16px,env(safe-area-inset-left,0px))}
main{max-width:640px;margin:0 auto;display:flex;flex-direction:column;gap:12px}
h1{font:400 38px/1.1 'Neucha',system-ui,sans-serif;margin:0 0 6px}
a{display:block;background:var(--paper);border:1px solid var(--line);border-radius:8px;padding:14px 16px;color:inherit;text-decoration:none;min-height:44px}
a:focus-visible{outline:2px solid #c4372b;outline-offset:2px}
a b{display:block;font-size:19px}a span{color:var(--soft)}
</style></head><body>
<main>
