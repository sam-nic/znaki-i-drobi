<html lang="ru"><head>

<style>
/* Layout: одна колонка на листе в клетку. Главная: план занятий, затем экраны урока, заданий и итога. */
:root{
  --paper:#fbfcfe; --grid:#dfe7f2; --ground:#f0f4fa;
  --ink:#1c2a55; --ink-soft:#56628a; --line:#c9d3e6;
  --pen:#c4372b; --pen-bg:#fbe9e6;
  --ok:#2c7a4b; --ok-bg:#e3f3e9; --part:#9a6a12; --part-bg:#fbf0d6;
  --f-display:'Neucha','Comic Sans MS',cursive;
  --f-body:'PT Sans',system-ui,sans-serif;
  --f-math:'PT Serif',Georgia,serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#192142; --grid:#222c52; --ground:#131a36;
  --ink:#e4e9fa; --ink-soft:#9aa6cc; --line:#34406b;
  --pen:#ff8173; --pen-bg:#3b2430;
  --ok:#6fd49a; --ok-bg:#1d3a31; --part:#f0c46a; --part-bg:#3a3320;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#192142; --grid:#222c52; --ground:#131a36;
  --ink:#e4e9fa; --ink-soft:#9aa6cc; --line:#34406b;
  --pen:#ff8173; --pen-bg:#3b2430;
  --ok:#6fd49a; --ok-bg:#1d3a31; --part:#f0c46a; --part-bg:#3a3320;
  color-scheme:dark}
*{box-sizing:border-box}
body{
  background-color:var(--ground);
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:24px 24px;
  color:var(--ink);font:17px/1.55 var(--f-body);
  padding-block:20px 48px;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
}
#app{max-width:720px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
h1,h2,h3{font-family:var(--f-display);font-weight:400;margin:0;text-wrap:balance}
h2{font-size:28px;line-height:1.1}
h3{font-size:20px}
p{margin:0}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,label:focus-within{outline:2px solid var(--pen);outline-offset:2px}
.sheet{background:var(--paper);border:1px solid var(--line);border-radius:6px;padding:20px;min-width:0;display:flex;flex-direction:column;gap:14px}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.brand{font-family:var(--f-display);font-size:22px}
.brand small{font-family:var(--f-body);font-size:13px;color:var(--ink-soft);margin-left:8px}
.tabs{display:flex;gap:6px}
.tab{border:1px solid var(--line);background:var(--paper);border-radius:8px;padding:8px 16px;min-height:44px;font-size:16px}
.tab[aria-current="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.meta{font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-soft)}
.soft{color:var(--ink-soft)}
.btn{border:1px solid var(--ink);background:transparent;border-radius:8px;padding:12px 20px;min-height:48px;font-size:17px;font-weight:700}
.btn.main{background:var(--ink);color:var(--paper)}
.btn.pen{background:var(--pen);border-color:var(--pen);color:#fff}
.btn.sm{padding:8px 14px;min-height:44px;font-size:16px;font-weight:400}
.btn:disabled{opacity:.4;cursor:default}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.row.between{justify-content:space-between}
.next{border:1px solid var(--pen);background:var(--pen-bg);border-radius:6px;padding:14px 16px;display:flex;flex-direction:column;gap:8px}
.mods{display:flex;flex-direction:column;gap:8px}
.mod{display:flex;gap:12px;align-items:center;text-align:left;width:100%;min-height:64px;border:1px solid var(--line);background:var(--paper);border-radius:8px;padding:12px 14px}
.mod .n{font-family:var(--f-display);font-size:24px;width:28px;flex:none;color:var(--ink-soft)}
.mod .t{flex:1;min-width:0}
.mod .t b{display:block}
.mod .t span{font-size:15px;color:var(--ink-soft)}
.lnk{display:inline-flex;align-items:center;text-decoration:none;color:var(--ink)}
.rp{margin:0;white-space:pre-wrap;font:16px/1.5 var(--f-body);background:var(--paper);border:1px solid var(--line);border-radius:6px;padding:10px 12px;user-select:all}
sup{font-size:.7em;line-height:0}
.chip{font-size:13px;border-radius:999px;padding:2px 10px;border:1px solid var(--line);white-space:nowrap}
.chip.ok{background:var(--ok-bg);border-color:var(--ok);color:var(--ok)}
.chip.need{background:var(--pen-bg);border-color:var(--pen);color:var(--pen)}
.chip.key{background:var(--part-bg);border-color:var(--part);color:var(--part)}
.box{border:1px solid var(--line);border-radius:6px;padding:12px 14px;display:flex;flex-direction:column;gap:6px}
.box.rule{background:color-mix(in srgb,var(--ink) 6%,var(--paper));border-color:var(--ink)}
.box.warn{background:var(--pen-bg);border-color:var(--pen)}
.box .h{font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-soft)}
.math{font-family:var(--f-math);font-size:19px;line-height:1.7}
.ex{font-family:var(--f-math);font-size:24px;white-space:nowrap}
.fr{display:inline-flex;flex-direction:column;align-items:center;vertical-align:middle;line-height:1.15;margin:0 2px;font-size:.9em}
.fr>span:first-child{border-bottom:1.5px solid currentColor;padding:0 4px}
.fr>span:last-child{padding:0 4px}
.steps{display:flex;gap:6px;flex-wrap:wrap}
.step{font-size:15px;border:1px solid var(--line);border-radius:999px;padding:3px 12px;color:var(--ink-soft)}
.step[aria-current="true"]{background:var(--ink);border-color:var(--ink);color:var(--paper)}
.bar{height:6px;border-radius:3px;background:var(--line);overflow:hidden}
.bar>i{display:block;height:100%;background:var(--ink)}
.q{font-family:var(--f-math);font-size:20px;line-height:1.6}
.ans{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.ans input{font:24px var(--f-math);color:var(--ink);background:var(--paper);border:1px solid var(--line);border-radius:6px;padding:9px 12px;width:min(100%,240px)}
.ans input.ok{border-color:var(--ok);background:var(--ok-bg)}
.ans input.bad{border-color:var(--pen);background:var(--pen-bg)}
.keys{display:flex;gap:6px}
.keys button{min-width:44px;height:44px;border:1px solid var(--line);background:var(--paper);border-radius:8px;font:22px var(--f-math)}
.pad{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;max-width:360px}
.pad button{height:56px;border:1px solid var(--line);background:var(--paper);border-radius:10px;font:26px var(--f-math);touch-action:manipulation}
.pad button:active{background:color-mix(in srgb,var(--ink) 12%,var(--paper))}
.pad .wide{grid-column:span 2;font:17px var(--f-body)}
.pad button.on,.keys button.on{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.pad .fn{background:color-mix(in srgb,var(--ink) 8%,var(--paper))}
.prev{min-height:44px;display:flex;align-items:center;font-family:var(--f-math);font-size:20px;color:var(--ink-soft)}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:8px}
.opt{border:1px solid var(--line);background:var(--paper);border-radius:8px;padding:10px;font-family:var(--f-math);font-size:22px;min-height:60px}
.opt.right{border-color:var(--ok);background:var(--ok-bg)}
.opt.wrong{border-color:var(--pen);background:var(--pen-bg)}
.opts.multi{grid-template-columns:1fr}
.opt.chk{display:flex;align-items:center;gap:12px;text-align:left;font-size:20px;min-height:56px;line-height:1.5}
.opt.chk .bx{flex:none;width:26px;height:26px;border:2px solid var(--ink);border-radius:5px;display:inline-flex;align-items:center;justify-content:center;font:700 18px var(--f-body);line-height:1}
.opt.chk[aria-pressed="true"]{border-color:var(--ink);background:var(--grid)}
.opt.chk[aria-pressed="true"] .bx{background:var(--ink);color:var(--paper)}
.opt.miss{border-style:dashed;border-color:var(--ok)}
.hint{font-size:15px;color:var(--ink-soft)}
.opt.chk .lb{flex:1;min-width:0}
.tag{display:block;font:14px var(--f-body);color:var(--ink-soft)}
.fb{border:1px solid;border-radius:6px;padding:12px 14px;display:flex;flex-direction:column;gap:6px}
.fb.ok{background:var(--ok-bg);border-color:var(--ok)}
.fb.bad{background:var(--pen-bg);border-color:var(--pen)}
.fig{margin:4px 0 10px}.fig svg{display:block;margin:0 auto}
.soon{opacity:.75}
#board{display:block;width:100%;height:auto;aspect-ratio:960/660;border:1px solid var(--line);border-radius:6px;background:var(--paper);touch-action:none;cursor:crosshair}
.confetti{position:fixed;left:0;top:0;width:0;height:0;pointer-events:none;z-index:50}
.confetti i{position:absolute;left:0;top:0;width:9px;height:14px;border-radius:2px;opacity:0}
@media (prefers-reduced-motion:no-preference){
  .fb.ok{animation:pop .45s cubic-bezier(.3,1.6,.5,1)}
  .fb.ok b::before{content:'\2605';display:inline-block;margin-right:8px;color:#f2b01e;animation:spin .7s ease-out}
  .fb.bad{animation:shake .45s ease-in-out}
  .confetti i{animation:cf 1.2s cubic-bezier(.2,.7,.4,1) forwards}
  @keyframes pop{0%{transform:scale(.88);opacity:0}100%{transform:scale(1);opacity:1}}
  @keyframes spin{from{transform:rotate(-200deg) scale(.2)}to{transform:rotate(0) scale(1)}}
  @keyframes shake{0%,100%{transform:translateX(0)}15%{transform:translateX(-7px)}35%{transform:translateX(6px)}55%{transform:translateX(-4px)}75%{transform:translateX(3px)}}
  @keyframes cf{0%{opacity:1;transform:translate(0,0) rotate(0)}40%{opacity:1;transform:translate(var(--x1),var(--y1)) rotate(var(--r))}100%{opacity:0;transform:translate(var(--x2),var(--y2)) rotate(calc(var(--r)*2))}}
}
.fb.form{background:var(--part-bg);border-color:var(--part)}
.fb .sol{font-family:var(--f-math);font-size:18px;line-height:1.8}
.score{display:flex;gap:18px;align-items:baseline;flex-wrap:wrap}
.score .big{font-family:var(--f-display);font-size:60px;line-height:1}
.score .mark{font-family:var(--f-display);font-size:60px;line-height:1;color:var(--pen)}
.tags{display:flex;gap:6px;flex-wrap:wrap}
.tag{font-size:13px;border:1px solid var(--pen);color:var(--pen);background:var(--pen-bg);border-radius:999px;padding:2px 10px}
.list{display:flex;flex-direction:column;gap:8px}
.ev{border:1px solid var(--line);border-radius:6px;padding:10px 14px;display:flex;flex-direction:column;gap:4px}
.ev .head{display:flex;gap:8px;justify-content:space-between;flex-wrap:wrap}
.note{font-size:15px;color:var(--ink-soft)}
svg text{fill:currentColor;font-family:var(--f-math)}
@media (max-width:480px){.sheet{padding:16px 14px}.q{font-size:22px;line-height:1.7}.ex{font-size:26px}.math{font-size:20px}.row .btn{flex:1 1 150px}.opts{grid-template-columns:1fr 1fr}.opt{font-size:24px;min-height:64px}.ans input{width:100%;font-size:26px;height:56px}.prev{font-size:22px}.score .big,.score .mark{font-size:52px}h2{font-size:30px}}
@media (prefers-reduced-motion:no-preference){.sheet{animation:in .18s ease-out}@keyframes in{from{opacity:.4;transform:translateY(3px)}}}
</style>
</head><body>
<div id="app"></div>
<script>
/* ================= Математика ================= */
function gcd(a,b){a=Math.abs(a);b=Math.abs(b);while(b){var t=a%b;a=b;b=t}return a}
function lcm(a,b){return a/gcd(a,b)*b}
function F(n,d){if(d===undefined)d=1;if(!d)return null;if(d<0){n=-n;d=-d}var g=gcd(n,d)||1;return {n:n/g,d:d/g}}
function add(a,b){return F(a.n*b.d+b.n*a.d,a.d*b.d)}
function sub(a,b){return F(a.n*b.d-b.n*a.d,a.d*b.d)}
function mul(a,b){return F(a.n*b.n,a.d*b.d)}
function dvd(a,b){return b.n?F(a.n*b.d,a.d*b.n):null}
function neg(a){return F(-a.n,a.d)}
function eqF(a,b){return !!a&&!!b&&a.n===b.n&&a.d===b.d}
function ri(a,b){return a+Math.floor(Math.random()*(b-a+1))}
function pick(a){return a[Math.floor(Math.random()*a.length)]}
function sgn(){return Math.random()<.5?-1:1}
function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t}return a}
function mixedOf(x){var n=Math.abs(x.n),w=Math.floor(n/x.d);return {s:x.n<0?-1:1,w:w,n:n-w*x.d,d:x.d}}

/* ---------- Запись чисел (HTML) ---------- */
function fr(n,d){return '<span class="fr"><span>'+n+'</span><span>'+d+'</span></span>'}
function Hr(n,d){return (n<0?'−':'')+(d===1?Math.abs(n):fr(Math.abs(n),d))}
function H(x){return Hr(x.n,x.d)}
function Hm(x){if(x.d===1||Math.abs(x.n)<x.d)return H(x);var m=mixedOf(x);return (m.s<0?'−':'')+m.w+(m.n?fr(m.n,m.d):'')}
function Hmx(w,n,d){return w+fr(n,d)} // положительное смешанное число
function I(x){return x<0?'−'+(-x):String(x)}
function Ip(x){return x<0?'('+I(x)+')':String(x)}
function Pp(x,h){return x.n<0?'('+h+')':h}
function EX(h){return '<span class="ex">'+h+'</span>'}
/* ---------- Разбор введённого ответа ---------- */
var SUPD='⁰¹²³⁴⁵⁶⁷⁸⁹';
function parseAns(str){
  var s=String(str||'').replace(/[\u00a0\u202f\u2009\u2007]/g,' ').trim().replace(/[−–—]/g,'-').replace(/,/g,'.');
  /* терпимость к записи: «x = 5», «+5», «5.», «.5», разряды через пробел «70 000» */
  s=s.replace(/^[A-Za-zА-Яа-я]\s*=\s*/,'').replace(/^\+\s*/,'').replace(/[.\s]+$/,'').replace(/^(-?)\s*\./,function(_,m){return m+'0.'});
  if(/^-?\s*\d{1,3}(\s\d{3})+(\.\d+)?$/.test(s))s=s.replace(/\s/g,'');
  s=s.replace(/[⁰¹²³⁴⁵⁶⁷⁸⁹⁻]+/g,function(x){return '^'+x.replace(/./g,function(c){return c==='⁻'?'-':SUPD.indexOf(c)})});
  var m;
  if((m=s.match(/^(-?)\s*(\d+)\s*\^\s*(-?\d+)$/))){
    var bs0=+m[2],ex0=+m[3];if(Math.abs(ex0)>12||(bs0===0&&ex0<0))return null;
    return {kind:'pow',s:m[1]?-1:1,b:bs0,e:ex0,v:mul(F(m[1]?-1:1),pwr(F(bs0),ex0))};
  }
  if((m=s.match(/^(-?)\s*(\d+)\s+(\d+)\s*\/\s*(\d+)$/))){
    var w=+m[2],n=+m[3],d=+m[4];if(!d)return null;
    return {kind:'mixed',s:m[1]?-1:1,w:w,n:n,d:d,v:F((m[1]?-1:1)*(w*d+n),d)};
  }
  if((m=s.match(/^(-?)\s*(\d+)\s*\/\s*(\d+)$/))){
    var n2=+m[2],d2=+m[3];if(!d2)return null;
    return {kind:'frac',s:m[1]?-1:1,n:n2,d:d2,v:F((m[1]?-1:1)*n2,d2)};
  }
  if((m=s.match(/^(-?)\s*(\d+)(?:\.(\d+))?$/))){
    var dec=m[3]||'',den=Math.pow(10,dec.length),num=+(m[2]+dec);
    return {kind:dec?'dec':'int',s:m[1]?-1:1,v:F((m[1]?-1:1)*num,den),raw:s};
  }
  return null;
}
function previewHTML(p){
  if(!p)return '';
  var sg=p.s<0?'−':'';
  if(p.kind==='mixed')return sg+p.w+fr(p.n,p.d);
  if(p.kind==='frac')return sg+fr(p.n,p.d);
  if(p.kind==='pow')return sg+p.b+'<sup>'+(p.e<0?'−'+(-p.e):p.e)+'</sup>';
  return sg+(p.kind==='dec'?p.raw.replace('-','').replace('.',','):Math.abs(p.v.n));
}
var T_OTHER='Другая ошибка';
function judge(t,input){
  var p=parseAns(input);
  if(!p)return {res:'invalid'};
  if(!eqF(p.v,t.ans))return wrongOf(t,p.v);
  if(p.kind==='frac'&&(gcd(p.n,p.d)!==1))return {res:'form',msg:'Значение верное, но дробь можно сократить. Сократите её до конца и введите ещё раз.'};
  if(p.kind==='frac'&&p.d===1)return {res:'form',msg:'Целое число запишите без знаменателя.'};
  if(p.kind==='mixed'){
    if(p.n>=p.d||gcd(p.n,p.d)!==1)return {res:'form',msg:'Дробная часть записана неверно: она должна быть правильной и сокращённой.'};
  }
  if(t.form==='improper'&&p.kind==='mixed')return {res:'form',msg:'Здесь нужна неправильная дробь, а не смешанное число.'};
  if(t.form==='mixed'&&p.kind!=='mixed')return {res:'form',msg:'Здесь нужно смешанное число: целая часть и правильная дробь, например 3 2/5.'};
  return {res:'ok'};
}
function wrongOf(t,v){
  for(var i=0;i<t.traps.length;i++)if(eqF(v,t.traps[i].v))return {res:'wrong',type:t.traps[i].type,msg:t.traps[i].msg};
  return {res:'wrong',type:T_OTHER,msg:''};
}

/* ================= Задания ================= */
function TR(v,type,msg){return {v:v,type:type,msg:msg}}
function mk(mod,q,ans,traps,steps,form){
  var seen=[ans];
  var tr=(traps||[]).filter(function(t){
    if(!t.v)return false;
    for(var i=0;i<seen.length;i++)if(eqF(seen[i],t.v))return false;
    seen.push(t.v);return true;
  });
  return {mod:mod,q:q,ans:ans,traps:tr,steps:steps,form:form||null};
}
/* показ дробей как числитель/знаменатель с знаком */
/* ================= Геометрия: чертежи (SVG) ================= */
function pwr(a,n){var r=F(1),k=Math.abs(n),i;for(i=0;i<k;i++)r=mul(r,a);return n<0?dvd(F(1),r):r}
function r1(x){return Math.round(x*10)/10}
function sv(w,h,body,label){return '<div class="fig"><svg viewBox="0 0 '+w+' '+h+'" width="100%" style="max-width:'+w+'px;color:var(--ink)" role="img" aria-label="'+(label||'Чертёж')+'" font-family="PT Serif,Georgia,serif" font-size="16">'+body+'</svg></div>'}
function tx(x,y,s,o){o=o||{};return '<text x="'+r1(x)+'" y="'+r1(y)+'" text-anchor="'+(o.a||'middle')+'"'+(o.s?' font-size="'+o.s+'"':'')+(o.b?' font-weight="700"':'')+(o.c||o.halo?' style="'+(o.c?'fill:'+o.c+';':'')+(o.halo?'paint-order:stroke;stroke:var(--paper);stroke-width:6px;stroke-linejoin:round':'')+'"':'')+'>'+s+'</text>'}
function ln(x1,y1,x2,y2,o){o=o||{};return '<line x1="'+r1(x1)+'" y1="'+r1(y1)+'" x2="'+r1(x2)+'" y2="'+r1(y2)+'" stroke="'+(o.c||'currentColor')+'" stroke-width="'+(o.w||2)+'"'+(o.d?' stroke-dasharray="'+o.d+'"':'')+' stroke-linecap="round"/>'}
function dt(x,y,c){return '<circle cx="'+r1(x)+'" cy="'+r1(y)+'" r="4" fill="'+(c||'currentColor')+'"/>'}
function qm(s){return s==='?'?{c:'var(--pen)',b:1}:{}}

/* отрезок с точками: names, lens (пропорции), labels над промежутками, total — скобка снизу */
function lineFig(names,lens,labels,total,o){
  o=o||{};var x0=28,x1=332,S=lens.reduce(function(a,b){return a+b},0),k=(x1-x0)/S,y=50,x=[x0],i,b='';
  for(i=0;i<lens.length;i++)x.push(x[i]+lens[i]*k);
  b+=ln(x0-16,y,x1+16,y,{w:2});
  for(i=0;i<x.length;i++)b+=dt(x[i],y)+tx(x[i],y+24,names[i]||'',{b:1});
  (o.eq||[]).forEach(function(j){var c=(x[j]+x[j+1])/2;b+=ln(c,y-8,c,y+8,{w:2.5,c:'var(--pen)'})});

/* ломаная (closed=false) или многоугольник (closed=true) с подписанными сторонами */

  for(i=0;i<m;i++){

/* лучи из точки O: rays [{d,n,ext,len,c}], arcs [{a,b,r,l,right,eq}] */
function angFig(rays,arcs,o){

    var r=a.r||40,A2=pt(a.a,r),B2=pt(a.b,r),big=(a.b-a.a)>180?1:0;
    b+='<path d="M'+r1(A2[0])+' '+r1(A2[1])+' A'+r+' '+r+' 0 '+big+' 0 '+r1(B2[0])+' '+r1(B2[1])+'" fill="none" stroke="var(--pen)" stroke-width="2.5"/>';
    if(a.eq){var m=(a.a+a.b)/2;for(var k=0;k<a.eq;k++){var mm=m+(k-(a.eq-1)/2)*7,p1=pt(mm,r-6),p2=pt(mm,r+6);b+=ln(p1[0],p1[1],p2[0],p2[1],{w:2,c:'var(--pen)'})}}
    if(a.l){var T2=pt((a.a+a.b)/2,r+((a.b-a.a)<45?24:17));b+=tx(T2[0],T2[1]+5,a.l,qm(a.l))}
  });

    if(r.n){var t=pt(r.d,L*(r.len||1)+15);b+=tx(t[0],t[1]+5,r.n,{b:1})}
    if(r.n2){var t2=pt(r.d+180,L*(r.len2||.55)+15);b+=tx(t2[0],t2[1]+5,r.n2,{b:1})}

/* ================= Геометрия: помощники заданий ================= */
function toF(v){return F(Math.round(v*100),100)}
function Nn(v){return String(Math.round(v*100)/100).replace('.',',')}
function Nf(x){return x.d===1?String(x.n):Nn(x.n/x.d)}
var UNIT={'см':'сантиметрах','дм':'дециметрах','м':'метрах','°':'градусах','′':'минутах'};
function GT(mod,q,val,unit,traps,steps){
  var tr=[];(traps||[]).forEach(function(x){if(x[0]>0&&Math.abs(x[0]-val)>1e-9)tr.push(TR(toF(x[0]),x[1],x[2]||''))});
  var t=mk(mod,q,toF(val),tr,steps);t.unit=unit||'';return t;
}
function ansHint(t){
  var a=t.ans,h=a.d===1?'Ответ — целое число':'Ответ — число';
  if(t.unit&&UNIT[t.unit])h+=' (в '+UNIT[t.unit]+', без единиц измерения)';
  h+='.';
  if(a.d!==1)h+=' Десятичную дробь пишите через запятую, например 4,5.';
  return h;
}
function showAns(t){if(t.draw)return t.draw.text;return Nf(t.ans)+(t.unit?(t.unit==='°'||t.unit==='′'?'':' ')+t.unit:'')}
var LET='ABCDEFGHKLMNPQRSTUVWXYZ';
function letters(n){var s=LET.split('').slice(0,n);return s}
function pickL(n){var a=shuffle(LET.split('')).slice(0,n);return a}

/* единичный выбор для числовых заданий (тренажёр) */
function numChoice(t){
  if(t.choice||t.multi)return t;
  var a=t.ans,v=a.n/a.d,vals=[a],seen={};seen[Nf(a)]=1;
  function put(x){if(vals.length>=4||!(x>0))return;var f=toF(x);if(seen[Nf(f)])return;seen[Nf(f)]=1;vals.push(f)}
  t.traps.forEach(function(x){put(x.v.n/x.v.d)});
  [v+1,v-1,v*2,v/2,v+10,v-10,v+5,180-v,v+2,v-2,v+3].forEach(put);
  var sh=shuffle(vals.map(function(f,i){return {v:f,ok:i===0}}));
  var u=t.unit?(t.unit==='°'||t.unit==='′'?'':' ')+t.unit:'';
  var n=Object.assign({},t);
  n.choice={opts:sh.map(function(o){return Nf(o.v)+u}),correct:sh.findIndex(function(o){return o.ok}),vals:sh.map(function(o){return o.v})};
  return n;
}
/* мультивыбор: верные и неверные утверждения темы */
var THEORY={};
function poolTask(id){
  var P=THEORY[id],T=shuffle(P.T),Fl=shuffle(P.F),nT=ri(2,3),items=[];
  T.slice(0,nT).forEach(function(s){items.push({h:s,ok:true,type:null})});
  Fl.slice(0,5-nT).forEach(function(s){items.push({h:s[0],ok:false,type:s[1]||'Путают понятия'})});
  return {mod:id,q:P.q,ans:F(0),traps:[],steps:P.steps,multi:shuffle(items),theory:true};
}
function nonZero(id){var t,i=0;do{t=modOf(id).gen()}while(t.ans.n===0&&++i<30);return t}
function trainTask(id){var d=Math.random()<.3?drawGen(id):null;if(d)return d;if(THEORY[id]&&Math.random()<.4)return poolTask(id);return numChoice(nonZero(id))}
function trainTasks(id,n){var out=[],i;for(i=0;i<n;i++){var d=(i%4===3)?drawGen(id):null;if(d){out.push(d);continue}out.push(THEORY[id]&&Math.random()<.3?poolTask(id):numChoice(nonZero(id)))}return out}
function typedGen(id){var t,i=0;do{t=nonZero(id)}while((t.choice||t.multi||t.draw)&&++i<30);return t}

/* ================= Глава 1. Начальные понятия геометрии ================= */

/* g1: повторение (§1) */
function gG1(){
  var t=ri(0,4),a,b,P,c,s,k;
  if(t===0){a=ri(3,12);b=ri(2,10);P=2*(a+b);
    return GT('g1','Периметр прямоугольника равен '+P+' см, одна его сторона — '+a+' см. Найдите соседнюю сторону.',b,'см',
      [[P-a,'Сторон четыре, а не две','Периметр — сумма четырёх сторон: две по '+a+' см и две неизвестные.'],[P/2,'Нашли полупериметр','P : 2 = '+(P/2)+' — это сумма двух соседних сторон, а не одна сторона.'],[P-2*a,'Не разделили на 2','Две неизвестные стороны вместе дают '+(P-2*a)+' см. На одну приходится вдвое меньше.']],
      'P = 2 · (a + b), поэтому a + b = '+P+' : 2 = '+(P/2)+'. Вторая сторона: '+(P/2)+' − '+a+' = '+b+' см.');}
  if(t===1){s=ri(2,15);P=4*s;
    return GT('g1','Периметр квадрата равен '+P+' см. Найдите его сторону.',s,'см',
      [[P/2,'Делили не на 4','У квадрата четыре равные стороны, делить нужно на 4.'],[P/3,'Делили не на 4','Сторон четыре, а не три.'],[P-s*2,'Не тот способ','Сторона квадрата равна P : 4.']],
      'Стороны квадрата равны, их четыре: '+P+' : 4 = '+s+' см.');}
  if(t===2){a=ri(4,12);b=ri(4,12);c=ri(Math.abs(a-b)+1,a+b-1);P=a+b+c;
    return GT('g1','Периметр треугольника равен '+P+' см, две его стороны — '+a+' см и '+b+' см. Найдите третью сторону.',c,'см',
      [[P-a,'Вычли только одну сторону','Нужно вычесть обе известные стороны.'],[a+b,'Сложили стороны','Третья сторона — это P минус сумма двух известных.']],
      'Сумма двух сторон: '+a+' + '+b+' = '+(a+b)+'. Третья сторона: '+P+' − '+(a+b)+' = '+c+' см.');}
  if(t===3){k=pick([2,3,4,5,6,9,10,12,18]);
    return GT('g1','Развёрнутый угол равен 180°. Чему равна '+fr(1,k)+' развёрнутого угла?',180/k,'°',
      [[90/k,'Взяли прямой угол вместо развёрнутого','Развёрнутый угол — 180°, а не 90°.'],[360/k,'Взяли полный угол','Полный угол — 360°, а развёрнутый — 180°.']],
      '180° : '+k+' = '+(180/k)+'°.');}
  a=ri(3,9);do{b=ri(2,8)}while(b===a);var S=a*b;
  return GT('g1','Площадь прямоугольника равна '+S+' см², одна сторона — '+a+' см. Найдите периметр прямоугольника.',2*(a+b),'см',
    [[a+b,'Нашли полупериметр','Периметр — удвоенная сумма соседних сторон.'],[b,'Нашли только сторону','Сначала сторона, потом периметр.'],[S+a,'Смешали площадь и периметр','Периметр считают по сторонам, а не по площади.']],
    'Вторая сторона: '+S+' : '+a+' = '+b+' см. Периметр: 2 · ('+a+' + '+b+') = '+(2*(a+b))+' см.');
}

/* g2: предмет геометрии (§2) */
function gG2(){
  var t=ri(0,4),a,b,c,n;
  if(t===0){
    var SOL=[['куб',8,12,6,'cube'],['прямоугольный параллелепипед',8,12,6,'box'],['треугольная пирамида',4,6,4,'pyr']],S=pick(SOL),w=ri(0,2),W=['вершин','рёбер','граней'],v=S[1+w];
    var tr=[];[0,1,2].forEach(function(j){if(j!==w)tr.push([S[1+j],'Перепутали вершины, рёбра и грани','У фигуры «'+S[0]+'»: '+S[1]+' вершин, '+S[2]+' рёбер, '+S[3]+' граней.'])});
    return GT('g2',solidFig(S[4])+'Сколько у фигуры «'+S[0]+'» '+W[w]+'?',v,'',tr,
      'Считаем по чертежу, включая невидимые штриховые рёбра. Вершин '+S[1]+', рёбер '+S[2]+', граней '+S[3]+'.');}
  if(t===1){n=ri(4,7);var nm=letters(n),lens=[];for(var i=0;i<n-1;i++)lens.push(ri(2,4));var tot=n*(n-1)/2;
    return GT('g2',lineFig(nm,lens,[],null)+'На прямой отмечены '+n+' точек. Сколько всего отрезков с концами в этих точках?',tot,'',
      [[n-1,'Посчитали только соседние точки','Отрезком является и пара несоседних точек, например '+nm[0]+nm[2]+'.'],[n*(n-1),'Посчитали AB и BA как разные','Отрезок AB и отрезок BA — один и тот же.'],[n,'Посчитали точки','Нужно считать отрезки, а не точки.']],
      'От первой точки '+(n-1)+' отрезков, от второй ещё '+(n-2)+', и так далее: '+Array.apply(null,Array(n-1)).map(function(_,j){return n-1-j}).join(' + ')+' = '+tot+'.');}
  if(t===2){n=ri(4,6);var tot2=n*(n-1)/2;
    return GT('g2','Отмечено '+n+' точек, никакие три из них не лежат на одной прямой. Сколько различных прямых можно провести через пары этих точек?',tot2,'',
      [[n*(n-1),'Посчитали каждую пару дважды','Через две точки проходит только одна прямая.'],[n,'Посчитали точки','Прямых больше, чем точек.'],[n-1,'Посчитали только из одной точки','Из каждой точки идёт '+(n-1)+' прямых, но каждая прямая посчитана дважды.']],
      'Через две точки проходит ровно одна прямая. Пар точек: '+n+' · '+(n-1)+' : 2 = '+tot2+'.');}
  if(t===3){
    if(Math.random()<.5){a=ri(2,9);var Sx=12*a;
      return GT('g2','Сумма длин всех рёбер куба равна '+Sx+' см. Найдите длину одного ребра.',a,'см',
        [[Sx/6,'Рёбер не 6','У куба 12 рёбер, а 6 — это число граней.'],[Sx/8,'Рёбер не 8','У куба 12 рёбер, а 8 — это число вершин.'],[Sx/4,'Рёбер не 4','Рёбер 12, все равны.']],
        'У куба 12 равных рёбер: '+Sx+' : 12 = '+a+' см.');}
    a=ri(2,7);
    return GT('g2','Найдите площадь поверхности куба с ребром '+a+' см (в квадратных сантиметрах).',6*a*a,'см²',
      [[a*a,'Нашли площадь одной грани','У куба 6 граней, нужна сумма их площадей.'],[4*a*a,'Взяли 4 грани','Граней у куба шесть.'],[6*a,'Умножили ребро на 6','Площадь грани — a · a, а не a.'],[a*a*a,'Нашли объём','Здесь нужна площадь, а не объём.']],
      'Каждая грань — квадрат площадью '+a+' · '+a+' = '+(a*a)+'. Граней 6: 6 · '+(a*a)+' = '+(6*a*a)+'.');}
  a=ri(2,6);b=ri(3,7);c=ri(2,8);

    [[a*b+b*c+a*c,'Взяли только половину граней','Граней шесть: три пары одинаковых.'],[a*b*c,'Нашли объём','Здесь нужна площадь поверхности.']],
    'Три пары одинаковых граней: '+a+' · '+b+' = '+(a*b)+', '+b+' · '+c+' = '+(b*c)+', '+a+' · '+c+' = '+(a*c)+'. Сумма '+(a*b+b*c+a*c)+', удваиваем: '+(2*(a*b+b*c+a*c))+'.');
}

/* g3: прямая, луч, отрезок, ломаная (§3) */
function gG3(){
  var t=ri(0,4),a,b,n,T,N;
  if(t===0){a=ri(3,14);b=ri(3,14);N=pickL(3);var C=N[1];
    if(Math.random()<.5)
      return GT('g3',lineFig([N[0],C,N[2]],[a,b],[a+' см',b+' см'],'?')+'Точка '+C+' лежит на отрезке '+N[0]+N[2]+'. '+N[0]+C+' = '+a+' см, '+C+N[2]+' = '+b+' см. Найдите '+N[0]+N[2]+'.',a+b,'см',
        [[Math.abs(a-b),'Вычли вместо сложения','Длина всего отрезка равна сумме длин его частей.']],
        N[0]+N[2]+' = '+N[0]+C+' + '+C+N[2]+' = '+a+' + '+b+' = '+(a+b)+' см.');
    T=a+b;
    return GT('g3',lineFig([N[0],C,N[2]],[a,b],[a+' см','?'],T+' см')+'Точка '+C+' лежит на отрезке '+N[0]+N[2]+'. '+N[0]+N[2]+' = '+T+' см, '+N[0]+C+' = '+a+' см. Найдите '+C+N[2]+'.',b,'см',
      [[T+a,'Сложили вместо вычитания','Часть отрезка меньше всего отрезка: вычитаем.']],
      C+N[2]+' = '+N[0]+N[2]+' − '+N[0]+C+' = '+T+' − '+a+' = '+b+' см.');}
  if(t===1){N=pickL(3);var M=N[1];
    if(Math.random()<.5){a=ri(2,19);
      return GT('g3',lineFig([N[0],M,N[2]],[1,1],[a+' см',null],'?',{eq:[0,1]})+M+' — середина отрезка '+N[0]+N[2]+'. '+N[0]+M+' = '+a+' см. Найдите '+N[0]+N[2]+'.',2*a,'см',
        [[a,'Не удвоили','Середина делит отрезок на две равные части, всего отрезок вдвое длиннее.'],[a/2,'Разделили вместо умножения','Весь отрезок больше своей половины.'],[a+2,'Прибавили 2','Нужно умножить на 2.']],
        M+N[2]+' = '+N[0]+M+' = '+a+' см, поэтому '+N[0]+N[2]+' = 2 · '+a+' = '+(2*a)+' см.');}
    T=ri(5,40);
    return GT('g3',lineFig([N[0],M,N[2]],[1,1],['?',null],T+' см',{eq:[0,1]})+M+' — середина отрезка '+N[0]+N[2]+'. '+N[0]+N[2]+' = '+T+' см. Найдите '+N[0]+M+'.',T/2,'см',
      [[T*2,'Умножили вместо деления','Половина отрезка меньше всего отрезка.'],[T,'Взяли весь отрезок','Нужна только половина.']],
      N[0]+M+' = '+N[0]+N[2]+' : 2 = '+T+' : 2 = '+Nn(T/2)+' см.');}
  if(t===2){a=2*ri(2,9);b=2*ri(2,9);N=pickL(5);
    return GT('g3',lineFig([N[0],N[1],N[2],N[3],N[4]],[a/2,a/2,b/2,b/2],[null,null,null,null],'?',{eq:[0,1,2,3],tr:[1,3]})+'Точка '+N[2]+' лежит на отрезке '+N[0]+N[4]+'. '+N[1]+' — середина '+N[0]+N[2]+', '+N[3]+' — середина '+N[2]+N[4]+'. '+N[0]+N[2]+' = '+a+' см, '+N[2]+N[4]+' = '+b+' см. Найдите '+N[1]+N[3]+'.',(a+b)/2,'см',
      [[a+b,'Не взяли половины','Расстояние между серединами — половина всего отрезка '+N[0]+N[4]+'.'],[Math.abs(a-b)/2,'Вычли вместо сложения','Части лежат рядом, их длины складываются.']],
      N[1]+N[2]+' = '+(a/2)+' см, '+N[2]+N[3]+' = '+(b/2)+' см. '+N[1]+N[3]+' = '+(a/2)+' + '+(b/2)+' = '+((a+b)/2)+' см.');}
  if(t===3){var sub=ri(0,2);
    if(sub===0){n=ri(3,5);var ls=[];for(var i=0;i<n;i++)ls.push(ri(2,9));var nm=letters(n+1),sum=ls.reduce(function(x,y){return x+y},0);
      return GT('g3',polyFig(nm,ls.map(function(x){return x+' см'}),false)+'Найдите длину ломаной '+nm.join('')+'.',sum,'см',
        [[sum-ls[0],'Пропустили одно звено','Длина ломаной — сумма длин всех её звеньев.'],[ls.reduce(function(x,y){return Math.max(x,y)},0),'Взяли самое длинное звено','Нужна сумма всех звеньев.']],
        'Длина ломаной — сумма звеньев: '+ls.join(' + ')+' = '+sum+' см.');}
    if(sub===1){var q=[ri(3,9),ri(3,9),ri(3,9),ri(3,9)],nm2=letters(4),sum2=q.reduce(function(x,y){return x+y},0);
      return GT('g3',polyFig(nm2,q.map(function(x){return x+' см'}),true)+'Найдите периметр четырёхугольника '+nm2.join('')+'.',sum2,'см',
        [[sum2-q[3],'Пропустили сторону','Периметр — сумма длин всех сторон.'],[2*(q[0]+q[1]),'Решили, что стороны попарно равны','Здесь стороны разные, складываем все четыре.']],
        'Периметр — сумма всех сторон: '+q.join(' + ')+' = '+sum2+' см.');}
    a=ri(3,9);var k=ri(2,6);
    return GT('g3','В треугольнике ABC сторона AB равна '+a+' см, сторона BC на '+k+' см больше AB, а сторона CA в 2 раза больше AB. Найдите периметр треугольника.',a+(a+k)+2*a,'см',
      [[a+k+2*a,'Не учли сторону AB','В периметр входят все три стороны, включая AB.'],[a+a+k+a+2,'Неверно поняли «в 2 раза больше»','«В 2 раза больше» значит умножить на 2.']],
      'BC = '+a+' + '+k+' = '+(a+k)+', CA = 2 · '+a+' = '+(2*a)+'. Периметр: '+a+' + '+(a+k)+' + '+(2*a)+' = '+(4*a+k)+' см.');}
  n=ri(3,8);var ps=ri(0,2),nmz=letters(n);
  if(ps===0)return GT('g3',lineFig(nmz,Array.apply(null,Array(n-1)).map(function(){return ri(2,4)}),[],null)+'Точки отмечены на прямой. На сколько частей они делят прямую?',n+1,'',
    [[n,'Посчитали точки','Кроме отрезков между точками есть ещё два луча по краям.'],[n-1,'Посчитали только отрезки','Два луча по краям тоже части прямой.']],
    'Между '+n+' точками '+(n-1)+' отрезков и ещё два луча по краям: '+(n-1)+' + 2 = '+(n+1)+'.');
  if(ps===1)return GT('g3','На прямой отмечено '+n+' точек. Сколько среди частей, на которые они делят прямую, отрезков (то есть частей, ограниченных с двух сторон)?',n-1,'',
    [[n,'Посчитали точки','Отрезков на один меньше, чем точек.'],[n+1,'Посчитали все части','Лучи в это число не входят.']],
    'Соседние точки образуют '+(n-1)+' отрезков.');
  return GT('g3','Ломаная имеет '+n+' вершин. Сколько у неё звеньев?',n-1,'',
    [[n,'Звеньев столько же, сколько вершин','У незамкнутой ломаной звеньев на одно меньше, чем вершин.'],[n+1,'Прибавили 1','Звеньев на одно меньше.']],
    'Звенья соединяют соседние вершины: '+n+' − 1 = '+(n-1)+'.');
}

/* g4: окружность и круг (§4) */
function gG4(){
  var t=ri(0,4),r,x,d;
  if(t===0){
    if(Math.random()<.5){d=ri(3,40);
      return GT('g4','Диаметр окружности равен '+d+' см. Найдите её радиус.',d/2,'см',
        [[d*2,'Перепутали радиус и диаметр','Диаметр вдвое больше радиуса, значит радиус — половина диаметра.'],[d,'Не разделили','Радиус — половина диаметра.']],
        'Диаметр равен двум радиусам: r = '+d+' : 2 = '+Nn(d/2)+' см.');}
    r=ri(2,25);
    return GT('g4','Радиус окружности равен '+r+' см. Найдите её диаметр.',2*r,'см',
      [[r/2,'Перепутали радиус и диаметр','Диаметр вдвое больше радиуса.'],[r,'Не удвоили','Диаметр — это два радиуса.']],
      'Диаметр состоит из двух радиусов: 2 · '+r+' = '+(2*r)+' см.');}
  if(t===1){r=ri(3,12);x=ri(2,2*r-1);var N=pickL(2);
    return GT('g4',circFig([{n:N[0],a:138},{n:N[1],a:42}],[['O',N[0],r+' см'],['O',N[1],r+' см'],[N[0],N[1],x+' см']])+'Точки '+N[0]+' и '+N[1]+' лежат на окружности с центром O, радиус равен '+r+' см, хорда '+N[0]+N[1]+' = '+x+' см. Найдите периметр треугольника '+N[0]+'O'+N[1]+'.',2*r+x,'см',
      [[r+x,'Взяли один радиус','Оба отрезка O'+N[0]+' и O'+N[1]+' — радиусы.'],[2*(r+x),'Удвоили всё','Хорду нужно взять один раз.'],[3*r,'Решили, что хорда равна радиусу','Длина хорды дана: '+x+' см.']],
      'O'+N[0]+' = O'+N[1]+' = '+r+' см как радиусы. Периметр: '+r+' + '+r+' + '+x+' = '+(2*r+x)+' см.');}
  if(t===2){var kind=pick(['ext','ext','int','int']),a,b;
    if(kind==='ext'){a=ri(2,9);b=ri(2,9);
      if(Math.random()<.5)return GT('g4',tcFig(a,b,'ext','?')+'Окружности с центрами O₁ и O₂ касаются внешним образом. Их радиусы '+a+' см и '+b+' см. Найдите расстояние между центрами.',a+b,'см',
        [[Math.abs(a-b),'Вычли радиусы','При внешнем касании радиусы лежат на одной прямой друг за другом, их длины складываются.'],[a*b,'Умножили радиусы','Расстояние между центрами равно сумме радиусов.']],
        'Точка касания лежит на отрезке O₁O₂, поэтому O₁O₂ = '+a+' + '+b+' = '+(a+b)+' см.');
      return GT('g4',tcFig(a,b,'ext',(a+b)+' см')+'Окружности касаются внешним образом, расстояние между центрами '+(a+b)+' см, радиус одной из них '+a+' см. Найдите радиус другой окружности.',b,'см',
        [[a+b+a,'Сложили всё','Из расстояния между центрами нужно вычесть известный радиус.'],[Math.abs(b-a),'Взяли разность радиусов','Радиусы складываются.']],
        'O₁O₂ = r₁ + r₂, поэтому r₂ = '+(a+b)+' − '+a+' = '+b+' см.');}
    var R=ri(5,14);a=ri(2,R-2);
    if(Math.random()<.5)return GT('g4',tcFig(R,a,'int','?')+'Окружность радиуса '+a+' см касается изнутри окружности радиуса '+R+' см. Найдите расстояние между центрами.',R-a,'см',
      [[R+a,'Сложили радиусы','При внутреннем касании меньший радиус лежит внутри большего: расстояние — разность.'],[R,'Взяли больший радиус','Нужно вычесть радиус меньшей окружности.']],
      'Центры лежат на одном радиусе большей окружности: O₁O₂ = '+R+' − '+a+' = '+(R-a)+' см.');
    return GT('g4',tcFig(R,a,'int',(R-a)+' см')+'Меньшая окружность касается изнутри большей радиуса '+R+' см. Расстояние между центрами '+(R-a)+' см. Найдите радиус меньшей окружности.',a,'см',
      [[R+(R-a),'Сложили','Радиус меньшей окружности — разность радиуса большей и расстояния.'],[R-a,'Взяли расстояние','Расстояние не равно радиусу.']],
      'O₁O₂ = R − r, поэтому r = '+R+' − '+(R-a)+' = '+a+' см.');}
  if(t===3){
    if(Math.random()<.5){r=ri(2,20);
      return GT('g4','Радиус окружности равен '+r+' см. Какую наибольшую длину может иметь хорда этой окружности?',2*r,'см',
        [[r,'Взяли радиус','Самая длинная хорда — диаметр, то есть два радиуса.'],[4*r,'Взяли удвоенный диаметр','Хорда не длиннее диаметра.']],
        'Наибольшая хорда — диаметр: 2 · '+r+' = '+(2*r)+' см.');}
    d=2*ri(2,15);
    return GT('g4','Диаметр окружности равен '+d+' см. Чему равен радиус окружности, если известно, что наибольшая хорда окружности равна диаметру?',d/2,'см',
      [[d*2,'Перепутали','Радиус — половина диаметра.']],'Радиус — половина наибольшей хорды: '+d+' : 2 = '+(d/2)+' см.');}
  r=ri(3,9);var ds=[];for(var i=0;i<5;i++)ds.push(pick([r-2,r-1,r,r,r+1,r+2,r+3]));
  var w=ri(0,2),cnt=[ds.filter(function(v){return v===r}).length,ds.filter(function(v){return v<r}).length,ds.filter(function(v){return v>r}).length],NA=['на окружности','внутри окружности','вне окружности'];
  return GT('g4','Радиус окружности равен '+r+' см. Расстояния от центра до точек A, B, C, D, E равны '+ds.join(' см, ')+' см. Сколько из этих точек лежат '+NA[w]+'?',cnt[w],'',
    [[cnt[0]+cnt[1],'Включили лишние точки','Точка на окружности и точка внутри круга — разные случаи.'],[cnt[1],'Пересчитали не те точки','Сравните каждое расстояние с радиусом '+r+' см.'],[cnt[2],'Пересчитали не те точки','Сравните каждое расстояние с радиусом '+r+' см.'],[cnt[0],'Пересчитали не те точки','Сравните каждое расстояние с радиусом '+r+' см.']],
    'Точка на окружности: расстояние равно '+r+' см; внутри — меньше '+r+'; вне — больше '+r+'. Подходят '+cnt[w]+' из 5.');
}

/* g5: угол, виды углов (§5) */
function gG5(){
  var t=ri(0,4),x,y,N;
  if(t===0){x=ri(15,80);y=ri(15,175-x);N=pickL(3);var tot=x+y,sh=ri(0,2);
    var rays=[{d:0,n:N[0]},{d:x,n:N[1]},{d:tot,n:N[2]}];
    if(sh===0)return GT('g5',angFig(rays,[{a:0,b:x,r:46,l:x+'°'},{a:x,b:tot,r:62,l:y+'°'},{a:0,b:tot,r:92,l:'?'}])+'Луч O'+N[1]+' проходит внутри угла '+N[0]+'O'+N[2]+'. ∠'+N[0]+'O'+N[1]+' = '+x+'°, ∠'+N[1]+'O'+N[2]+' = '+y+'°. Найдите ∠'+N[0]+'O'+N[2]+'.',tot,'°',
      [[Math.abs(x-y),'Вычли вместо сложения','Угол, составленный из двух углов, равен их сумме.'],[180-tot,'Нашли смежный угол','Нужен сам угол '+N[0]+'O'+N[2]+', а не смежный с ним.']],
      '∠'+N[0]+'O'+N[2]+' = ∠'+N[0]+'O'+N[1]+' + ∠'+N[1]+'O'+N[2]+' = '+x+'° + '+y+'° = '+tot+'°.');
    return GT('g5',angFig(rays,[{a:0,b:x,r:46,l:x+'°'},{a:x,b:tot,r:62,l:'?'},{a:0,b:tot,r:92,l:tot+'°'}])+'Луч O'+N[1]+' проходит внутри угла '+N[0]+'O'+N[2]+'. ∠'+N[0]+'O'+N[2]+' = '+tot+'°, ∠'+N[0]+'O'+N[1]+' = '+x+'°. Найдите ∠'+N[1]+'O'+N[2]+'.',y,'°',
      [[tot+x,'Сложили вместо вычитания','Часть угла меньше всего угла: вычитаем.'],[180-y,'Нашли смежный угол','Нужен сам угол, а не смежный с ним.']],

 g8:{rule:'Треугольник — фигура из трёх точек (вершин), не лежащих на одной прямой, и трёх отрезков (сторон). Периметр треугольника — сумма длин его сторон.<br>Равные треугольники совмещаются наложением: у них равны соответственные стороны и соответственные углы. Против равных сторон лежат равные углы.',

function progress(){
  var p={diag:{},final:{},passed:{},best:{},lastCheck:{},train:{}};
  st.events.forEach(function(e){
    if(e.kind==='diag'){var c=e.mod||'c1';if(!p.diag[c]||e.ts>p.diag[c].ts)p.diag[c]=e}
    if(e.kind==='module'){p.best[e.mod]=Math.max(p.best[e.mod]||0,e.score);if(e.passed)p.passed[e.mod]=true;if(!p.lastCheck[e.mod]||e.ts>p.lastCheck[e.mod].ts)p.lastCheck[e.mod]=e}
    if(e.kind==='train'){if(!p.train[e.mod]||e.ts>p.train[e.mod])p.train[e.mod]=e.ts}
    if(e.kind==='final'){var c2=e.mod||'c1';if(!p.final[c2]||e.score>p.final[c2].score)p.final[c2]=e}
  });
  return p;
}

function checkLocked(id,p){var lc=p.lastCheck[id];return !!lc&&!lc.passed&&!(p.train[id]&&p.train[id]>lc.ts)}
function modStatus(id,p){
  if(p.passed[id])return 'ok';
  var d=p.diag['c'+modOf(id).ch];
  if(d)return (d.need||[]).indexOf(id)>=0?'need':'fine';
  return '';
}
function nextStep(p){
  for(var k=0;k<CHAPS.length;k++){
    var c=CHAPS[k];if(!c.ready)continue;
    var ms=MODS.filter(function(m){return m.ch===c.n}),d=p.diag['c'+c.n],left=ms.filter(function(m){return !p.passed[m.id]});
    if(!left.length&&p.final['c'+c.n])continue;
    if(!d&&left.length===ms.length)return {text:'Начните с диагностики главы '+c.n+': «'+c.title+'». По ней приложение покажет, какие темы повторять.',btn:'Диагностика главы '+c.n,act:'diag',ch:c.n};
    if(left.length){
      var need=(d&&d.need||[]).filter(function(id){return !p.passed[id]});
      need.sort(function(a,b){return MODS.findIndex(function(m){return m.id===a})-MODS.findIndex(function(m){return m.id===b})});
      var nm=need.length?need[0]:left[0].id;
      return {text:(need.length?'Следующая тема: ':'Дальше по порядку: ')+modOf(nm).title+(need.length?'. В диагностике здесь были ошибки.':'.'),btn:'Открыть тему',act:'mod',mod:nm};
    }
    return {text:'Все темы главы '+c.n+' пройдены. Можно сдавать итоговый тест.',btn:'Итоговый тест главы '+c.n,act:'final',ch:c.n};
  }
  return {text:'Все доступные темы пройдены. Остальные главы появятся позже.',btn:'Повторить диагностику',act:'diag',ch:1};
}
function buildTasks(kind,modId){
  var items=[],i,ch,pl;
  if(kind==='check'){for(i=0;i<CHECK_N;i++)items.push([modId,typedGen(modId)]);var d=drawGen(modId);if(d)items[CHECK_N-1]=[modId,d]}
  else{ch=+String(modId).replace('c','');pl=PLANS[ch];
    if(kind==='diag'){pl.diag.forEach(function(id){items.push([id,typedGen(id)])});
      pl.ddraw.forEach(function(id){var k=-1;items.forEach(function(x,n){if(x[0]===id)k=n});if(k>=0)items[k]=[id,drawGen(id)]})}
    if(kind==='final'){Object.keys(pl.final).forEach(function(id){for(var k=0;k<pl.final[id];k++)items.push([id,typedGen(id)])});
      pl.fdraw.forEach(function(id){var k=-1;items.forEach(function(x,n){if(k<0&&x[0]===id)k=n});if(k>=0)items[k]=[id,drawGen(id)]});
      items=shuffle(items)}}
  return items.map(function(x){return x[1]});
}
function startRun(kind,modId){
  var tasks=kind==='train'?trainTasks(modId,TRAIN_N):buildTasks(kind,modId);
  st.run={kind:kind,mod:modId||null,tasks:tasks,i:0,results:[],phase:'ask',fb:null,input:'',picked:null,sel:[]};
  st.view='run';render();window.scrollTo(0,0);
}
function runTitle(r){
  var cn=r.mod&&/^c\d/.test(r.mod)?' главы '+r.mod.slice(1):'';
  return r.kind==='diag'?'Диагностика'+cn:r.kind==='final'?'Итоговый тест'+cn:r.kind==='check'?'Проверка: '+modOf(r.mod).title:'Тренажёр: '+modOf(r.mod).title;
}

/* ================= Запись событий ================= */
async function saveEvent(ev){
  ev.uid='local';ev.ts=Date.now();
  st.events.push(ev);
  lsWrite(lsRead().concat([ev]));
  st.saveMsg='';
  if(!CFG.endpoint){st.saveMsg='local';return}
  try{
    var ac=new AbortController(),tm=setTimeout(function(){ac.abort()},10000);
    var r=await fetch(CFG.endpoint,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({text:reportText(ev)}),signal:ac.signal});
    clearTimeout(tm);
    st.saveMsg=r.ok?'sent':'fail';
  }catch(e){st.saveMsg='fail'}
}

var CHECK_N=8,CHECK_PASS=6; /* проверка темы: заданий и сколько верных нужно для зачёта */

function render(){

}

function renderRun(){
  var r=st.run,t=r.tasks[r.i],total=r.tasks.length;
  var h='<div class="top"><div class="brand">'+runTitle(r)+'</div><button class="btn sm" id="quit">Выйти</button></div>';
  h+='<section class="sheet">';
  if(total)h+='<div class="row between"><span class="meta">Задание '+(r.i+1)+' из '+total+'</span></div><div class="bar" role="progressbar" aria-valuenow="'+r.i+'" aria-valuemax="'+total+'"><i style="width:'+Math.round(r.i/total*100)+'%"></i></div>';
  else h+='<span class="meta">Решено верно: '+r.results.filter(function(x){return x.ok}).length+' из '+r.results.length+'</span>';
  h+='<div class="q">'+t.q+'</div>';
  var locked=r.phase==='fb';
  if(t.multi){
    h+='<p class="hint">Отметьте все верные утверждения. Верных несколько.</p><div class="opts multi">';
    t.multi.forEach(function(o,k){
      var on=!!r.sel[k],cls='opt chk',tag='';
      if(locked){
        if(o.ok&&on)cls+=' right';else if(!o.ok&&on)cls+=' wrong';else if(o.ok&&!on){cls+=' miss';tag='<span class="tag">пропущено</span>'}
      }
      h+='<button class="'+cls+'" data-m="'+k+'" aria-pressed="'+(on?'true':'false')+'"'+(locked?' disabled':'')+'><span class="bx">'+(on?'✓':'')+'</span><span class="lb">'+o.h+tag+'</span></button>';
    });
    h+='</div>';
  }else if(t.draw){
    h+=drawHTML(t);
  }else if(t.choice){
    h+='<div class="opts">';
    t.choice.opts.forEach(function(o,k){
      var cls='opt';if(locked){if(k===t.choice.correct)cls+=' right';else if(k===r.picked)cls+=' wrong'}
      h+='<button class="'+cls+'" data-opt="'+k+'"'+(locked?' disabled':'')+'>'+o+'</button>';
    });
    h+='</div>';
  }else{
    var cls=locked?(r.fb.res==='ok'?' ok':' bad'):'';
    var hint=ansHint(t);if(hint)h+='<p class="note" id="fmt">'+hint+'</p>';
    h+='<div class="ans"><input id="in" class="'+cls.trim()+'" type="text" inputmode="'+(COARSE?'none':'text')+'" enterkeyhint="done" autocomplete="off" autocapitalize="off" spellcheck="false" aria-label="Ответ" placeholder="Ответ" value="'+esc(r.input)+'"'+(locked?' disabled':'')+'>';
    if(!locked){
      if(COARSE){
        var keys=['1','2','3','⌫','4','5','6',',','7','8','9','0'];
        h+='<div class="pad">';
        keys.forEach(function(k){
          if(k===' ')h+='<button data-k=" " aria-label="Пробел">␣</button>';
          else if(k==='pow')h+='<button class="fn" data-pow="1" aria-pressed="'+!!r.pow+'" aria-label="Степень: следующие цифры станут показателем">xⁿ</button>';
          else h+='<button'+(k==='⌫'||k==='−'||k==='/'?' class="fn"':'')+' data-k="'+k+'"'+(k==='⌫'?' aria-label="Стереть"':'')+'>'+k+'</button>';
        });
        h+='</div>';
      }else h+='';
    }
    h+='</div>';
    if(!locked)h+='<div class="prev" id="pv" aria-live="polite">'+previewHTML(parseAns(r.input))+'</div>';
  }
  if(r.fb&&r.phase==='fb'){
    var f=r.fb;
    if(f.res==='ok')h+='<div class="fb ok"><b>'+PRAISE[Math.floor(Math.random()*PRAISE.length)]+'</b></div>';
    else h+='<div class="fb bad"><b>Неверно. '+(t.multi?'Верные утверждения: '+t.multi.filter(function(o){return o.ok}).map(function(o){return o.h}).join('; ')+'.':'Ответ: '+(t.choice?t.choice.opts[t.choice.correct]:showAns(t)))+'</b>'+(f.msg?'<p>'+f.msg+'</p>':'')+'<div class="sol">'+t.steps+'</div></div>';
  }else if(r.fb&&r.fb.res==='form')h+='<div class="fb form"><b>Почти</b><p>'+r.fb.msg+'</p></div>';
  else if(r.fb&&r.fb.res==='invalid')h+='<div class="fb form"><b>Ответ не удалось разобрать</b><p>Запишите число цифрами. Примеры: 45, 4,5, 1 250.</p></div>';
  h+='<div class="row">';
  if(!locked)h+='<button class="btn main" id="go"'+(t.multi&&!r.sel.some(Boolean)?' disabled':'')+'>Ответить</button>';
  else h+='<button class="btn main" id="nxt">'+(total&&r.i===total-1?'Завершить':'Дальше')+'</button>';
  h+='</div>';
  if(!locked&&!t.choice&&!t.multi&&!t.draw)h+='<p class="note">Число пишите цифрами. Десятичную дробь — через запятую, например 4,5.</p>';
  h+='</section>';
  app.innerHTML=h;
  document.getElementById('quit').onclick=function(){
    if(confirmQuit()){st.view=r.kind==='train'?'lesson':'home';render()}
  };
  bindRun();
  var inp=document.getElementById('in');if(inp&&!locked&&!t.multi)inp.focus({preventScroll:true});
}
var COARSE=!!(window.matchMedia&&matchMedia('(pointer:coarse)').matches);
var quitArm=0;
function confirmQuit(){
  /* окна подтверждения в странице не работают: нужен второй клик */
  var now=Date.now();
  if(now-quitArm<4000)return true;
  quitArm=now;
  var b=document.getElementById('quit');if(b)b.textContent='Нажмите ещё раз: результаты не сохранятся';
  return false;
}
var PRAISE=['Верно!','Отлично!','Так держать!','Молодец!','Точно!','Класс!'];
function burst(){
  if(window.matchMedia&&matchMedia('(prefers-reduced-motion:reduce)').matches)return;
  var box=app.querySelector('.fb.ok');if(!box)return;
  var rc=box.getBoundingClientRect(),c=document.createElement('div'),cols=['#c4372b','#f2b01e','#2c7a4b','#2f6fd0','#8a4bc4','#e8682a'],h='',i;
  c.className='confetti';c.setAttribute('aria-hidden','true');
  c.style.left=Math.min(rc.left+60,innerWidth-20)+'px';c.style.top=Math.max(rc.top+10,20)+'px';
  for(i=0;i<34;i++){
    var a=-Math.PI*(.1+.8*Math.random()),v=90+Math.random()*150,x1=Math.cos(a)*v,y1=Math.sin(a)*v;
    h+='<i style="background:'+cols[i%cols.length]+';--x1:'+x1.toFixed(0)+'px;--y1:'+y1.toFixed(0)+'px;--x2:'+(x1*1.3+(Math.random()-.5)*60).toFixed(0)+'px;--y2:'+(y1+170+Math.random()*120).toFixed(0)+'px;--r:'+(Math.random()*360).toFixed(0)+'deg;animation-delay:'+(Math.random()*.12).toFixed(2)+'s"></i>';
  }
  c.innerHTML=h;document.body.appendChild(c);setTimeout(function(){c.remove()},1500);
}
function submit(){
  var r=st.run,t=r.tasks[r.i],fb;
  if(t.multi){
    if(!r.sel.some(Boolean))return;
    var bad=null,miss=false;
    t.multi.forEach(function(o,k){var on=!!r.sel[k];if(on&&!o.ok&&!bad)bad=o;if(!on&&o.ok)miss=true});
    if(!bad&&!miss)fb={res:'ok'};
    else fb={res:'wrong',type:bad?(bad.type||T_OTHER):'Пропущено верное утверждение',msg:bad?'Отмечено неверное утверждение.':'Верных утверждений больше, чем отмечено.'};
  }else if(t.choice){
    if(r.picked===null)return;
    var ok=r.picked===t.choice.correct;
    if(ok)fb={res:'ok'};
    else{var v=t.choice.vals[r.picked];fb=v?wrongOf(t,v):{res:'wrong',type:T_OTHER,msg:''};fb.res='wrong'}
  }else if(t.draw){
    fb=judgeDraw(t);
  }else{
    fb=judge(t,r.input);
    if(fb.res==='invalid'||fb.res==='form'){r.fb=fb;r.phase='ask';render();return}
  }
  r.fb=fb;r.phase='fb';
  r.results.push({ok:fb.res==='ok',mod:t.mod,type:fb.res==='ok'?null:(fb.type||T_OTHER)});
  render();
  if(fb.res==='ok')burst();
}
/* Enter: первое нажатие проверяет ответ, второе открывает следующее задание */
document.addEventListener('keydown',function(e){
  if(e.key!=='Enter'||e.repeat||st.view!=='run'||e.isComposing)return;
  var t=e.target;
  if(t&&t.tagName==='BUTTON'&&!t.hasAttribute('data-m'))return;
  var nx=document.getElementById('nxt'),g=document.getElementById('go');
  if(nx){e.preventDefault();nx.click()}
  else if(g&&!g.disabled){e.preventDefault();g.click()}
});
function bindRun(){
  var r=st.run;
  if(r.tasks[r.i].draw)bindDraw(r.tasks[r.i]);
  var inp=document.getElementById('in');
  if(inp){
    inp.oninput=function(){r.input=inp.value;r.fb=null;var pv=document.getElementById('pv');if(pv)pv.innerHTML=previewHTML(parseAns(r.input));
      var old=app.querySelector('.fb');if(old)old.remove()};
    inp.onkeydown=function(e){if(e.key==='Enter'){e.preventDefault();e.stopPropagation();if(!e.repeat)submit()}
      else if(r.pow&&!e.ctrlKey&&!e.metaKey&&!e.altKey&&/^[0-9-]$/.test(e.key)){e.preventDefault();putPow(e.key)}};
  }
  function putPow(c){
    var a=inp.selectionStart==null?inp.value.length:inp.selectionStart,z=inp.selectionEnd==null?a:inp.selectionEnd,ch=c==='-'?'⁻':SUPD[+c];
    inp.value=inp.value.slice(0,a)+ch+inp.value.slice(z);inp.setSelectionRange(a+1,a+1);inp.dispatchEvent(new Event('input'))}
  function powBtn(){app.querySelectorAll('[data-pow]').forEach(function(b){b.classList.toggle('on',!!r.pow);b.setAttribute('aria-pressed',!!r.pow)})}
  powBtn();
  app.querySelectorAll('[data-pow]').forEach(function(b){
    b.onmousedown=function(e){e.preventDefault()};b.onpointerdown=function(e){e.preventDefault()};
    b.onclick=function(){r.pow=!r.pow;powBtn();if(inp)inp.focus({preventScroll:true})}});
  app.querySelectorAll('[data-k]').forEach(function(b){
    b.onmousedown=function(e){e.preventDefault()};
    b.onpointerdown=function(e){e.preventDefault()};
    b.onclick=function(){if(!inp)return;
      var s=inp.selectionStart==null?inp.value.length:inp.selectionStart,e2=inp.selectionEnd==null?s:inp.selectionEnd,k=b.dataset.k,pos;
      if(r.pow&&k!=='⌫'){if(k==='−')k='⁻';else if(/^[0-9]$/.test(k))k=SUPD[+k];else{r.pow=false;powBtn()}}
      if(k==='⌫'){
        if(s===e2&&s>0){inp.value=inp.value.slice(0,s-1)+inp.value.slice(e2);pos=s-1}
        else{inp.value=inp.value.slice(0,s)+inp.value.slice(e2);pos=s}
      }else{inp.value=inp.value.slice(0,s)+k+inp.value.slice(e2);pos=s+k.length}
      inp.focus({preventScroll:true});inp.setSelectionRange(pos,pos);inp.dispatchEvent(new Event('input'))};
  });
  app.querySelectorAll('[data-opt]').forEach(function(b){b.onclick=function(){r.picked=Number(b.dataset.opt);submit()}});
  app.querySelectorAll('[data-m]').forEach(function(b){b.onclick=function(){
    var k=Number(b.dataset.m);r.sel[k]=!r.sel[k];
    b.setAttribute('aria-pressed',r.sel[k]?'true':'false');b.firstChild.textContent=r.sel[k]?'✓':'';
    var g=document.getElementById('go');if(g)g.disabled=!r.sel.some(Boolean)}});
  var go=document.getElementById('go');if(go)go.onclick=submit;
  var nx=document.getElementById('nxt');
  if(nx)nx.onclick=function(){
    var total=r.tasks.length;
    if(total&&r.i===total-1)return finishRun();
    r.i++;
    r.phase='ask';r.fb=null;r.input='';r.segs=[];r.pow=false;r.picked=null;r.sel=[];render();window.scrollTo(0,0);
  };
}

async function finishRun(){
  var r=st.run,score=r.results.filter(function(x){return x.ok}).length,max=r.tasks.length,errors={},badMods={};
  r.results.forEach(function(x){if(!x.ok){errors[x.type]=(errors[x.type]||0)+1;badMods[x.mod]=true}});
  var ev={kind:r.kind==='check'?'module':r.kind,mod:r.mod||'',title:runTitle(r),score:score,max:max,errors:errors};
  if(r.kind==='check')ev.passed=score>=CHECK_PASS;
  if(r.kind==='diag')ev.need=Object.keys(badMods);
  if(r.kind==='final'){ev.mark=markOf(score/max);ev.need=Object.keys(badMods)}
  r.ev=ev;r.badMods=Object.keys(badMods);
  st.view='summary';render();window.scrollTo(0,0);
  await saveEvent(ev);
  if(st.view==='summary')render();
}
function markOf(f){
  return f>=.95?10:f>=.85?9:f>=.75?8:f>=.65?7:f>=.55?6:f>=.45?5:f>=.35?4:f>=.25?3:f>=.15?2:1;
}


function reportText(ev){
  var d=new Date(ev.ts||Date.now()),pad=function(n){return (n<10?'0':'')+n};
  var l=['Геометрия 7. Результат: '+ev.title+'.','Баллы: '+ev.score+' из '+ev.max+(ev.mark?', отметка '+ev.mark+' по десятибалльной шкале':'')+'.'];
  if(ev.kind==='module')l.push(ev.passed?'Тема пройдена.':'Тема не пройдена: нужно '+CHECK_PASS+' из '+CHECK_N+'.');
  var need=(ev.need||[]).map(function(id){return modOf(id).title});
  if(need.length)l.push('Слабые темы: '+need.join('; ')+'.');
  var er=Object.keys(ev.errors||{}).sort(function(a,b){return ev.errors[b]-ev.errors[a]});
  if(er.length)l.push('Ошибки: '+er.map(function(k){return k+(ev.errors[k]>1?' ×'+ev.errors[k]:'')}).join('; ')+'.');
  l.push('Время: '+pad(d.getDate())+'.'+pad(d.getMonth()+1)+' '+pad(d.getHours())+':'+pad(d.getMinutes())+'.');
  return l.join('\n');
}
function renderSummary(){
  var r=st.run,ev=r.ev;
  var h='<div class="top"><div class="brand">'+esc(ev.title)+'</div></div><section class="sheet"><div class="meta">Результат</div>';
  h+='<div class="score"><span class="big">'+ev.score+'<span style="font-size:.45em;color:var(--ink-soft)"> / '+ev.max+'</span></span>'+(ev.mark?'<span class="mark" title="Ориентировочная отметка">'+ev.mark+'</span>':'')+'</div>';
  if(r.kind==='check')h+='<p>'+(ev.passed?'Тема пройдена.':'Нужно '+CHECK_PASS+' верных ответов из '+CHECK_N+'. Чтобы пересдать, сначала пройдите тренажёр: '+TRAIN_N+' заданий.')+'</p>';
  if(r.kind==='train')h+='<p>Тренажёр пройден. Теперь можно пересдавать проверку темы.</p>';
  if(r.kind==='diag')h+='<p>'+(ev.need.length?'Темы для повторения: '+ev.need.map(function(id){return modOf(id).title}).join('; ')+'.':'Ошибок нет: можно переходить к итоговому тесту.')+'</p>';
  if(r.kind==='final')h+='<p class="note">Отметка по десятибалльной шкале ориентировочная.</p>';
  var errs=Object.keys(ev.errors);
  if(errs.length){h+='<div class="box"><div class="h">Где были ошибки</div><div class="tags">'+errs.map(function(k){return '<span class="tag">'+esc(k)+(ev.errors[k]>1?' × '+ev.errors[k]:'')+'</span>'}).join('')+'</div></div>'}
  if(r.kind!=='check'&&r.kind!=='train'&&r.badMods.length){h+='<div class="box"><div class="h">Что повторить</div><div class="row">'+r.badMods.map(function(id){return '<button class="btn sm" data-open="'+id+'">'+modOf(id).title+'</button>'}).join('')+'</div></div>'}
  var msg=st.saveMsg;
  h+='<p class="note" id="sv">'+(msg==='sent'?'Результат отправлен родителю.':msg==='fail'?'Результат не отправлен, сохранён на этом устройстве.':msg==='local'?'Результат сохранён на этом устройстве.':'Сохраняю результат…')+'</p>';
  if(msg!=='sent')h+='<div class="box"><div class="h">Результат для папы</div><p class="note">Отправьте результат папе: нажмите «Отправить в Telegram».</p><pre class="rp" id="rp">'+esc(reportText(ev))+'</pre><div class="row"><a class="btn main lnk" id="tg" target="_blank" rel="noopener noreferrer" href="https://t.me/share/url?url='+encodeURIComponent(location.href.split('#')[0])+'&text='+encodeURIComponent(reportText(ev))+'">Отправить в Telegram</a><button class="btn sm" id="cp">Скопировать</button><span class="note" id="cpn"></span></div><p class="note">В Telegram выберите контакт папы и нажмите «Отправить». Если Telegram не открылся, скопируйте текст и отправьте вручную.</p></div>';
  h+='<div class="row">';
  if(r.kind==='check'&&!ev.passed){h+='<button class="btn main" id="totrain">Пройти тренажёр</button><button class="btn" id="home">К темам</button>'}
  else if(r.kind==='train'){h+='<button class="btn main" id="tolesson">К теме и проверке</button><button class="btn" id="home">К темам</button>'}
  else h+='<button class="btn main" id="home">К темам</button>';
  h+='</div></section>';
  app.innerHTML=h;
  document.getElementById('home').onclick=function(){st.view='home';render();window.scrollTo(0,0)};
  var tt=document.getElementById('totrain');if(tt)tt.onclick=function(){startRun('train',r.mod)};
  var tl=document.getElementById('tolesson');if(tl)tl.onclick=function(){st.mod=r.mod;st.view='lesson';render();window.scrollTo(0,0)};
  var cp=document.getElementById('cp');
  if(cp)cp.onclick=function(){
    var tx=reportText(ev),n=document.getElementById('cpn'),el=document.getElementById('rp');
    function sel(){var rg=document.createRange();rg.selectNodeContents(el);var sl=getSelection();sl.removeAllRanges();sl.addRange(rg);n.textContent='Текст выделен: нажмите «Копировать» в меню.'}
    try{navigator.clipboard.writeText(tx).then(function(){n.textContent='Скопировано.'},sel)}catch(e){sel()}};
  app.querySelectorAll('[data-open]').forEach(function(b){b.onclick=function(){st.mod=b.dataset.open;st.view='lesson';render();window.scrollTo(0,0)}});
}

/* ================= Родитель ================= */
function renderParent(){
  var mine=null,evs=lsRead().sort(function(a,b){return b.ts-a.ts});
  var kid=evs.filter(function(e){return e.uid!==mine});
  var ids=[];evs.forEach(function(e){if(e.uid!==mine&&ids.indexOf(e.uid)<0)ids.push(e.uid)});
  function who(uid){return uid===mine?'вы':ids.length>1?'ученик '+(ids.indexOf(uid)+1):'ученик'}
  var agg={};kid.forEach(function(e){Object.keys(e.errors||{}).forEach(function(k){agg[k]=(agg[k]||0)+e.errors[k]})});
  var aggKeys=Object.keys(agg).sort(function(a,b){return agg[b]-agg[a]});
  var h=header()+'<section class="sheet"><h3>Результаты</h3>';
  h+='<p class="note">Здесь только записи с этого устройства. Остальные приходят в Telegram.</p>';
  h+='<div class="box"><div class="h">Чаще всего ошибки</div>'+(aggKeys.length?'<div class="tags">'+aggKeys.slice(0,8).map(function(k){return '<span class="tag">'+esc(k)+' × '+agg[k]+'</span>'}).join('')+'</div>':'<p class="note">Пока нет данных от ученика.</p>')+'</div>';
  h+='<div class="row between"><div class="meta">Этапы</div><button class="btn sm" id="cp">Скопировать сводку</button></div><div class="list">';
  if(!evs.length)h+='<p class="note">Результатов пока нет. Они появятся здесь после первого пройденного этапа.</p>';
  evs.slice(0,60).forEach(function(e){
    var d=new Date(e.ts).toLocaleString('ru-RU',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'});
    var st2=e.kind==='module'?(e.passed?'пройдено':'не пройдено'):e.kind==='final'?'отметка '+e.mark:'';
    var errs=Object.keys(e.errors||{});
    h+='<div class="ev"><div class="head"><b>'+esc(e.title)+'</b><span class="note">'+d+', '+who(e.uid)+'</span></div><div>'+e.score+' из '+e.max+(st2?', '+st2:'')+'</div>'+(errs.length?'<div class="tags">'+errs.map(function(k){return '<span class="tag">'+esc(k)+(e.errors[k]>1?' × '+e.errors[k]:'')+'</span>'}).join('')+'</div>':'')+'</div>';
  });
  h+='</div><p class="note">Записи с пометкой «вы» — ваши пробные прохождения.</p></section>';
  app.innerHTML=h;bindHeader();
  document.getElementById('cp').onclick=function(){
    var txt=kid.slice(0,15).map(function(e){return new Date(e.ts).toLocaleString('ru-RU',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'})+' — '+e.title+': '+e.score+' из '+e.max+(Object.keys(e.errors||{}).length?'. Ошибки: '+Object.keys(e.errors).join(', '):'')}).join('\n')||'Результатов нет';
    var b=document.getElementById('cp');
    try{navigator.clipboard.writeText(txt).then(function(){b.textContent='Скопировано'},function(){b.textContent='Не удалось скопировать'})}catch(e){b.textContent='Не удалось скопировать'}
  };
}

/* ================= Запуск ================= */
st.events=lsRead();st.allEvents=st.events.slice();
render();
window.addEventListener('hashchange',function(){st.isOwner=/(^|[#&])parent($|&)/.test(location.hash);if(!st.isOwner)st.tab='play';if(st.view==='home')render()});
</script>
</body></html>
